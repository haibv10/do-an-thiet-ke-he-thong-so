name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**', 'release/**']
  pull_request:
    branches: [main, develop]

jobs:
  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Report the simulator version
        run: iverilog -V | head -1

      # run_tests.sh stops at the first failure, so a red job names the
      # testbench that broke as the last line of output.
      - name: Run the testbenches
        run: bash tools/run_tests.sh

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Report the compiler version
        run: riscv64-unknown-elf-gcc --version | head -1

      - name: Build the firmware
        run: bash tools/build_firmware.sh

      # The ROM depth lives in three places that have to agree: the array in
      # the RTL, the padding in make_hex.py and the region length in the
      # linker script. Each is read here rather than repeated, because a
      # hardcoded fourth copy is what broke this check when the ROM grew.
      - name: Check the ROM depth agrees everywhere
        run: |
          depth=$(sed -n 's/.*reg \[31:0\] rom \[0:\([0-9]*\)\].*/\1/p' \
                  source/cpu/mem_instruction_rom.v)
          depth=$((depth + 1))
          padded=$(sed -n 's/^ROM_WORDS = \([0-9]*\)$/\1/p' tools/make_hex.py)
          linker=$(sed -n 's/.*ROM (rx).*LENGTH = \([0-9]*\)K.*/\1/p' sw/linker.ld)
          echo "rtl $depth words, make_hex.py $padded words, linker ${linker}K"
          if [ "$padded" -ne "$depth" ]; then
            echo "make_hex.py pads to $padded words, the ROM holds $depth" >&2
            exit 1
          fi
          if [ "$((linker * 256))" -ne "$depth" ]; then
            echo "linker gives the ROM ${linker}K, the array holds $depth words" >&2
            exit 1
          fi

      # The image has to fill the ROM exactly, and _start has to sit at the
      # reset vector. Both break silently otherwise: an oversized image wraps
      # inside the array index, and a misplaced _start runs whatever is at zero.
      - name: Check the image fits the ROM and starts at the reset vector
        run: |
          depth=$(sed -n 's/^ROM_WORDS = \([0-9]*\)$/\1/p' tools/make_hex.py)
          words=$(wc -l < build/firmware/firmware.hex)
          if [ "$words" -ne "$depth" ]; then
            echo "firmware.hex is $words words, the ROM holds $depth" >&2
            exit 1
          fi
          start=$(riscv64-unknown-elf-nm build/firmware/firmware.elf \
                  | awk '$3 == "_start" { print $1 }')
          if [ "$start" != "00000000" ]; then
            echo "_start is at 0x$start, expected 0x00000000" >&2
            exit 1
          fi

      # Deliberately not compared byte for byte against the committed image:
      # a different GCC release generates different code, and a red build on a
      # toolchain bump is noise. firmware_boot_tb in the simulation job already
      # runs the committed image on the SoC and checks what it prints.
      - name: Report whether the rebuild matches the committed image
        run: |
          if git diff --quiet -- sw/firmware.hex; then
            echo "sw/firmware.hex reproduces with $(riscv64-unknown-elf-gcc -dumpversion)"
          else
            echo "sw/firmware.hex differs from a rebuild with $(riscv64-unknown-elf-gcc -dumpversion)"
          fi
